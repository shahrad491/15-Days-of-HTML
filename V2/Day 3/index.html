<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Nav Bar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="text-white">
      <div
        class="container-fluid py-2 bg-black d-flex justify-content-around position-relative"
      >
        <div class="fs-5 float-start">
          <strong
            ><sub><span class="text-danger fs-3 mt-5">C </span></sub
            >codedamn</strong
          >
        </div>
        <div class="">
          <ul class="d-md-flex flex-row text-secondary p-0 mt-1 mb-0 d-none">
            <a href="#" class="list-group-item me-2">Learn</a>
            <a href="#" class="list-group-item mx-2">Practice</a>
            <a href="#" class="list-group-item mx-2">Company</a>
            <a href="#" class="list-group-item ms-2">Pricing</a>
          </ul>
        </div>
        <div class="float-end">
          <button id="Login" class="d-none"></button
          ><label for="Login" class="text-secondary"
            ><small>Login</small></label
          >
          <button id="SignUp" class="d-none"></button
          ><label for="SignUp" class="bg-indigo rounded px-2 py-1 btn"
            ><strong class="text-light">GetStarted</strong></label
          >
        </div>
      </div>
      <div
        class="container-fluid bg-secondary py-1 d-flex justify-content-center d-md-none"
      >
        <ul class="d-flex flex-row text-secondary p-0 mb-0 text-white">
          <a href="#" class="list-group-item me-2">Learn</a>
          <a href="#" class="list-group-item mx-2">Practice</a>
          <a href="#" class="list-group-item mx-2">Company</a>
          <a href="#" class="list-group-item ms-2">Pricing</a>
        </ul>
      </div>
    </header>

</html>
